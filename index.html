<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create Minecraft Bedrock addons directly in your browser.">
    <title>Minecraft Bedrock Addon Creator</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>

    <style>
        :root {
            --bg: #111714;
            --panel: #1a2420;
            --panel-light: #22302a;
            --border: #34453d;
            --text: #edf5f0;
            --muted: #9eafa5;
            --green: #55c878;
            --green-dark: #2f8f50;
            --danger: #ef7777;
            --shadow: 0 18px 45px rgba(0, 0, 0, .28);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-width: 320px;
            background:
                radial-gradient(circle at top right, rgba(50, 117, 76, .2), transparent 35%),
                var(--bg);
            color: var(--text);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .app-shell {
            width: min(1180px, calc(100% - 32px));
            margin: 32px auto;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 24px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand-icon {
            display: grid;
            place-items: center;
            width: 48px;
            height: 48px;
            border: 1px solid #5ed17d;
            border-radius: 12px;
            background: linear-gradient(135deg, #316d42, #193925);
            box-shadow: 0 8px 22px rgba(39, 133, 74, .28);
            font-size: 25px;
        }

        h1, h2, p {
            margin-top: 0;
        }

        h1 {
            margin-bottom: 4px;
            font-size: clamp(1.45rem, 3vw, 2.1rem);
        }

        .subtitle,
        .hint {
            color: var(--muted);
        }

        .subtitle {
            margin-bottom: 0;
            font-size: .92rem;
        }

        .card {
            border: 1px solid var(--border);
            border-radius: 14px;
            background: rgba(26, 36, 32, .94);
            box-shadow: var(--shadow);
        }

        .form-card {
            padding: 22px;
            margin-bottom: 20px;
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 18px;
            padding-bottom: 13px;
            border-bottom: 1px solid var(--border);
        }

        .section-title h2 {
            margin: 0;
            font-size: 1.05rem;
        }

        .section-number {
            display: grid;
            place-items: center;
            width: 25px;
            height: 25px;
            border-radius: 7px;
            background: var(--green-dark);
            color: white;
            font-size: .8rem;
            font-weight: 700;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .field.full {
            grid-column: 1 / -1;
        }

        label {
            color: #d8e7de;
            font-size: .86rem;
            font-weight: 650;
        }

        input,
        select {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 8px;
            outline: none;
            padding: 11px 12px;
            background: #111a16;
            color: var(--text);
            font: inherit;
            transition: border-color .2s, box-shadow .2s;
        }

        input:focus,
        select:focus {
            border-color: var(--green);
            box-shadow: 0 0 0 3px rgba(85, 200, 120, .14);
        }

        input[type="file"] {
            padding: 8px;
            cursor: pointer;
        }

        .upload-row {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .preview {
            display: none;
            width: 62px;
            height: 62px;
            object-fit: cover;
            border: 1px solid var(--green);
            border-radius: 8px;
            image-rendering: pixelated;
        }

        .editor-card {
            overflow: hidden;
            margin-bottom: 20px;
        }

        .editor-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            padding: 15px 18px;
            border-bottom: 1px solid var(--border);
        }

        .editor-header h2 {
            margin: 0;
            font-size: 1.05rem;
        }

        .file-label {
            color: var(--muted);
            font-family: monospace;
            font-size: .82rem;
        }

        #editor {
            min-height: 400px;
            height: 52vh;
            width: 100%;
        }

        .actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
        }

        button {
            border: 0;
            border-radius: 9px;
            padding: 12px 19px;
            background: linear-gradient(135deg, #5dd17c, #329753);
            color: #07150c;
            cursor: pointer;
            font: inherit;
            font-weight: 750;
            transition: transform .2s, filter .2s;
        }

        button:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }

        button:disabled {
            cursor: wait;
            opacity: .65;
            transform: none;
        }

        .status {
            min-height: 22px;
            color: var(--muted);
            font-size: .9rem;
        }

        .status.success {
            color: var(--green);
        }

        .status.error {
            color: var(--danger);
        }

        .hint {
            margin: 8px 0 0;
            font-size: .78rem;
        }

        @media (max-width: 700px) {
            .app-shell {
                width: min(100% - 20px, 1180px);
                margin: 20px auto;
            }

            header {
                align-items: flex-start;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .field.full {
                grid-column: auto;
            }

            .form-card {
                padding: 16px;
            }

            #editor {
                height: 58vh;
            }
        }
    </style>
</head>
<body>
    <main class="app-shell">
        <header>
            <div class="brand">
                <div class="brand-icon" aria-hidden="true">⛏</div>
                <div>
                    <h1>Minecraft Bedrock Addon Creator</h1>
                    <p class="subtitle">Build and download JavaScript addons entirely in your browser.</p>
                </div>
            </div>
        </header>

        <section class="card form-card">
            <div class="section-title">
                <span class="section-number">1</span>
                <h2>Addon Details</h2>
            </div>

            <div class="form-grid">
                <div class="field">
                    <label for="addonName">Addon Name</label>
                    <input id="addonName" type="text" value="My Custom Addon">
                </div>

                <div class="field">
                    <label for="addonVersion">Addon Version</label>
                    <input id="addonVersion" type="text" value="1.0.0">
                </div>

                <div class="field full">
                    <label for="addonDescription">Addon Description</label>
                    <input id="addonDescription" type="text" value="Created with Minecraft Bedrock Web Creator">
                </div>

                <div class="field">
                    <label for="engineVersion">Minimum Engine Version</label>
                    <select id="engineVersion">
                        <option value="1.21.0">1.21.0</option>
                        <option value="1.20.80">1.20.80</option>
                        <option value="1.20.0">1.20.0</option>
                        <option value="1.19.80">1.19.80</option>
                    </select>
                </div>

                <div class="field">
                    <label for="scriptVersion">Script Module Version</label>
                    <select id="scriptVersion">
                        <option value="1.14.0">1.14.0</option>
                        <option value="1.13.0">1.13.0</option>
                        <option value="1.12.0">1.12.0</option>
                        <option value="1.10.0">1.10.0</option>
                    </select>
                </div>

                <div class="field full">
                    <label for="iconUpload">Cover Art / Pack Icon</label>
                    <div class="upload-row">
                        <input id="iconUpload" type="file" accept="image/png">
                        <img id="iconPreview" class="preview" alt="Pack icon preview">
                    </div>
                    <p class="hint">PNG files only. A generated Minecraft-style icon is used when no image is selected.</p>
                </div>
            </div>
        </section>

        <section class="card editor-card">
            <div class="editor-header">
                <h2>2. JavaScript Code</h2>
                <span class="file-label">scripts/main.js</span>
            </div>
            <div id="editor" aria-label="JavaScript code editor"></div>
        </section>

        <div class="actions">
            <div id="status" class="status" role="status"></div>
            <button id="downloadButton" type="button">⬇ Generate .mcaddon</button>
        </div>
    </main>

    <script>
        let monacoEditorInstance;

        const defaultCode = `import { world, system } from "@minecraft/server";

world.afterEvents.playerSpawn.subscribe((event) => {
    const player = event.player;

    player.sendMessage("§aWelcome to your custom addon!");
});

system.runInterval(() => {
    for (const player of world.getAllPlayers()) {
        player.onScreenDisplay.setActionBar("§2Custom Addon Active");
    }
}, 100);`;

        require.config({
            paths: {
                vs: "https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs"
            }
        });

        require(["vs/editor/editor.main"], () => {
            monacoEditorInstance = monaco.editor.create(document.getElementById("editor"), {
                value: defaultCode,
                language: "javascript",
                theme: "vs-dark",
                automaticLayout: true,
                minimap: { enabled: false },
                lineNumbers: "on",
                folding: true,
                bracketPairColorization: { enabled: true },
                autoClosingBrackets: "always",
                autoClosingQuotes: "always",
                tabCompletion: "on",
                smoothScrolling: true,
                fontSize: 14,
                padding: { top: 14, bottom: 14 },
                scrollbar: {
                    verticalScrollbarSize: 10,
                    horizontalScrollbarSize: 10
                }
            });

            window.addEventListener("resize", () => monacoEditorInstance.layout());
        });

        const iconUpload = document.getElementById("iconUpload");
        const iconPreview = document.getElementById("iconPreview");
        const statusElement = document.getElementById("status");
        const downloadButton = document.getElementById("downloadButton");

        iconUpload.addEventListener("change", () => {
            const file = iconUpload.files[0];

            if (!file) {
                iconPreview.style.display = "none";
                return;
            }

            if (file.type !== "image/png") {
                iconUpload.value = "";
                iconPreview.style.display = "none";
                showStatus("Please select a PNG image.", true);
                return;
            }

            const reader = new FileReader();
            reader.onload = event => {
                iconPreview.src = event.target.result;
                iconPreview.style.display = "block";
            };
            reader.readAsDataURL(file);
        });

        function parseVersion(version) {
            const match = String(version).trim().match(/^(\\d+)\\.(\\d+)\\.(\\d+)/);
            return match ? [Number(match[1]), Number(match[2]), Number(match[3])] : null;
        }

        function createUuid() {
            if (window.crypto && typeof window.crypto.randomUUID === "function") {
                return window.crypto.randomUUID();
            }

            return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, char => {
                const random = Math.random() * 16 | 0;
                const value = char === "x" ? random : (random & 3 | 8);
                return value.toString(16);
            });
        }

        function createFallbackIcon() {
            return new Promise(resolve => {
                const canvas = document.createElement("canvas");
                canvas.width = 256;
                canvas.height = 256;

                const context = canvas.getContext("2d");
                context.fillStyle = "#26352d";
                context.fillRect(0, 0, 256, 256);

                context.fillStyle = "#4a7c45";
                context.fillRect(0, 0, 256, 130);
                context.fillStyle = "#386334";
                context.fillRect(0, 130, 256, 126);

                context.fillStyle = "#6da84d";
                context.fillRect(24, 34, 208, 34);
                context.fillStyle = "#1d321f";
                context.fillRect(38, 68, 180, 20);

                context.fillStyle = "#151d18";
                context.fillRect(68, 145, 34, 34);
                context.fillRect(154, 145, 34, 34);
                context.fillRect(92, 198, 72, 18);

                canvas.toBlob(blob => resolve(blob), "image/png");
            });
        }

        function showStatus(message, isError = false) {
            statusElement.textContent = message;
            statusElement.className = `status ${isError ? "error" : "success"}`;
        }

        function safeFilename(name) {
            return String(name || "custom-addon")
                .trim()
                .replace(/[^a-z0-9-_]+/gi, "-")
                .replace(/^-+|-+$/g, "")
                .toLowerCase() || "custom-addon";
        }

        downloadButton.addEventListener("click", async () => {
            if (!monacoEditorInstance) {
                showStatus("The code editor is still loading. Please try again.", true);
                return;
            }

            const name = document.getElementById("addonName").value.trim() || "My Custom Addon";
            const description = document.getElementById("addonDescription").value.trim() ||
                "Created with Minecraft Bedrock Web Creator";
            const versionText = document.getElementById("addonVersion").value.trim();
            const version = parseVersion(versionText);

            if (!version) {
                showStatus("Version must use the format major.minor.patch, such as 1.0.0.", true);
                return;
            }

            downloadButton.disabled = true;
            showStatus("Generating your addon package...");

            try {
                const headerUuid = createUuid();
                const scriptUuid = createUuid();
                const selectedIcon = iconUpload.files[0];
                const iconBlob = selectedIcon || await createFallbackIcon();

                const manifest = {
                    format_version: 2,
                    header: {
                        name,
                        description,
                        uuid: headerUuid,
                        version,
                        min_engine_version: document.getElementById("engineVersion").value
                            .split(".").map(Number)
                    },
                    modules: [
                        {
                            description,
                            type: "data",
                            uuid: createUuid(),
                            version
                        },
                        {
                            description: `${name} JavaScript`,
                            type: "script",
                            language: "javascript",
                            uuid: scriptUuid,
                            version,
                            entry: "scripts/main.js"
                        }
                    ],
                    dependencies: [
                        {
                            module_name: "@minecraft/server",
                            version: document.getElementById("scriptVersion").value
                        }
                    ]
                };

                const zip = new JSZip();
                zip.file("manifest.json", JSON.stringify(manifest, null, 2));
                zip.file("pack_icon.png", iconBlob);
                zip.file("scripts/main.js", monacoEditorInstance.getValue());

                const archive = await zip.generateAsync({
                    type: "blob",
                    compression: "DEFLATE",
                    compressionOptions: { level: 6 }
                });

                const downloadUrl = URL.createObjectURL(archive);
                const link = document.createElement("a");
                link.href = downloadUrl;
                link.download = `${safeFilename(name)}.mcaddon`;
                document.body.appendChild(link);
                link.click();
                link.remove();

                setTimeout(() => URL.revokeObjectURL(downloadUrl), 1000);
                showStatus("Addon generated successfully. Your download should begin automatically.");
            } catch (error) {
                console.error(error);
                showStatus("Unable to generate the addon. Please check the browser console.", true);
            } finally {
                downloadButton.disabled = false;
            }
        });
    </script>
</body>
</html>
